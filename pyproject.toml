[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xesim"
version = "0.1.0"
description = "Bundle-specific Xenium staining simulator prototypes."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "xeSim contributors" }
]
dependencies = [
  # Core numeric / ML
  "numpy",
  "torch",
  "scipy",
  "scikit-image",
  "scikit-learn",
  "pandas",
  # Imaging IO (Xenium bundles need all of these)
  "Pillow",
  "tifffile",
  "imagecodecs",
  "zarr",
  "pyarrow",
  # Plotting (diagnostics are on by default on `xesim explain`)
  "matplotlib",
]

[project.optional-dependencies]
test = [
  "pytest",
]
dev = [
  "pytest",
]

[project.scripts]
xesim = "xesim.cli:main"

[tool.setuptools.packages.find]
include = ["xesim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
